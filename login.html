<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - JESAN</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:#f5f5f5;">
<div class="form-card">
  <h2>Acceso al Inventario</h2>
  <p class="subtexto">Solo personal autorizado</p>
  <input type="text" id="usuario" placeholder="Usuario">
  <input type="password" id="password" placeholder="Contraseña">
  <button onclick="login()">Ingresar</button>
</div>
<script>
function login() {
  const user = document.getElementById("usuario").value.trim();
  const pass = document.getElementById("password").value.trim();

  // ADMIN — acceso total
  if (user === "admin" && pass === "1234") {
    localStorage.setItem("auth", "admin");
    window.location.href = "inventario.html";
    return;
  }

  // VENDEDORES — creados por el admin
  const vendedores = JSON.parse(localStorage.getItem("vendedores") || "[]");
  const encontrado = vendedores.find(v => v.usuario === user && v.password === pass);
  if (encontrado) {
    localStorage.setItem("auth", "vendedor");
    window.location.href = "inventario.html";
    return;
  }

  alert("Acceso denegado");
}
document.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
