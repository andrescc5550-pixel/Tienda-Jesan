<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesan GT</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        .descripcion { display: none; font-size: 14px; color: #555; margin: 10px 0; }
        .descripcion.activo { display: block; }
    </style>
</head>
<body>

<header class="header">
    <img src="img/jesan.png" class="logo">
    <h1>JESAN</h1>
</header>

<main>
    <section class="intro">
        <h2>La elegancia también es parte de tu personalidad</h2>
    </section>

    <section class="productos" id="productos"></section>

    <div class="btn-container">
        <a href="mensajes.html" class="btn">Dejar un mensaje</a>
    </div>
</main>

<script>
    const API = "https://tienda-jesan.onrender.com/productos";

    async function cargarProductos() {
        try {
            const res = await fetch(API);
            const data = await res.json();
            const contenedor = document.getElementById("productos");
            contenedor.innerHTML = "";

            data.forEach(p => {
                if (Number(p.cantidad) <= 0) return;

                const card = document.createElement("div");
                card.className = "card";
                card.style.cursor = "pointer";

                card.innerHTML = `
                    <img src="${p.imagen || 'https://via.placeholder.com/300'}">
                    <h3>${p.nombre}</h3>
                    <span>Q${p.precio}</span>
                    <p style="font-size: 11px; color: #888;">Stock: ${p.cantidad}</p>
                    <p style="font-size: 12px; color: #aaa; margin-top:6px;">Toca para ver detalle</p>
                `;

                // UN CLIC → Ir a página de detalle
                card.addEventListener("click", () => {
                    window.location.href = `producto.html?id=${p.id}`;
                });

                contenedor.appendChild(card);
            });

        } catch (error) {
            console.error("Error cargando productos:", error);
        }
    }

    cargarProductos();
</script>

</body>
</html>
